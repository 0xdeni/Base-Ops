# The Depthwatch server with Docker Compose. From the repository root,
# `docker compose -f deploy/compose.yaml up -d --build` builds the image from the Dockerfile there
# and runs `depthwatch start`, the same as the `docker run` of docs/DEPLOY.md "Docker". Settings
# come from ./.env in the repository root (.env.example lists them; DEPTHWATCH_RPC_URL at least);
# the database lives in the named volume depthwatch-data, mounted at /data. The image's health
# check (GET /api/health) applies as it is. The port is published on the host's loopback only: a
# reverse proxy with TLS on the host fronts it (docs/DEPLOY.md "A reverse proxy with TLS"); a
# proxy running as another container joins this Compose network and reaches depthwatch:8787
# directly, with no published port at all.
name: depthwatch

services:
  depthwatch:
    build:
      context: ..
    image: depthwatch
    restart: unless-stopped
    # docker stop: SIGTERM, then SIGKILL after this. The server exits within
    # DEPTHWATCH_SHUTDOWN_GRACE (8 s).
    stop_grace_period: 10s
    env_file:
      - ../.env
    environment:
      # Wins over .env: the database stays in the volume.
      DEPTHWATCH_DB: /data/depthwatch.db
    ports:
      # host address:host port:container port. Loopback only: Docker publishes through its own
      # iptables chain, which the host firewall does not filter, so 0.0.0.0 would expose the API
      # and the admin token's plain-HTTP routes to the internet. The container port is 8787
      # unless .env sets DEPTHWATCH_PORT; then change the right side to match.
      - "127.0.0.1:8787:8787"
    volumes:
      - depthwatch-data:/data

volumes:
  depthwatch-data:
    # The volume `docker run -v depthwatch-data:/data` uses, so both ways share one database.
    name: depthwatch-data
