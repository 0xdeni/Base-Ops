<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Depthwatch: depth, spread, health and gaps for Uniswap, Aerodrome and Aero pools on Base mainnet."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0b0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted fonts (docs/design/visual-v4.md §3.3): preload the sans face only. -->
    <link
      rel="preload"
      href="/fonts/hanken-grotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Review modes for screenshots and tests only; the product follows the system (PH2).
      // ?theme=dark|light pins the scheme, ?nofonts=1 drops the web faces (the fallback check).
      try {
        const q = new URLSearchParams(location.search)
        const t = q.get('theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
        if (q.get('nofonts') === '1') document.documentElement.setAttribute('data-nofonts', '')
      } catch {}
    </script>
    <title>Depthwatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
